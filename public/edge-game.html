<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EDGE GAME</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

body {
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  background:#060606;
  color:#f0f0f0;
  transition: background 0.4s;
}

/* ───────── SCREENS ───────── */
.screen {
  position:fixed; inset:0;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px 24px;
  gap:22px;
  overflow-y:auto;
}
.screen.active { display:flex; }

/* ───────── SETUP ───────── */
#setup { background:#060606; }

.logo {
  font-size:4.5rem;
  font-weight:900;
  letter-spacing:6px;
  line-height:1;
  text-align:center;
  background: linear-gradient(135deg, #00ff88 0%, #00d4ff 50%, #bf5fff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo-sub {
  text-align:center;
  font-size:0.75rem;
  letter-spacing:3px;
  color:#333;
  text-transform:uppercase;
  margin-top:4px;
}

.grp { width:100%; }
.grp-label {
  font-size:0.68rem;
  letter-spacing:2.5px;
  color:#444;
  text-transform:uppercase;
  margin-bottom:10px;
}
.row { display:flex; gap:8px; }

.opt {
  flex:1;
  padding:14px 6px;
  border:2px solid #1a1a1a;
  border-radius:14px;
  background:#0e0e0e;
  color:#555;
  cursor:pointer;
  font-size:0.88rem;
  font-weight:600;
  text-align:center;
  line-height:1.5;
  transition:border-color 0.2s, color 0.2s, background 0.2s;
}
.opt small { display:block; font-size:0.68rem; font-weight:400; color:#333; }
.opt.on { border-color:#00ff88; color:#00ff88; background:#001a0e; }

#go-btn {
  width:100%;
  padding:22px;
  font-size:1.25rem;
  font-weight:900;
  border:none;
  border-radius:16px;
  background:#00ff88;
  color:#000;
  cursor:pointer;
  letter-spacing:4px;
  text-transform:uppercase;
  box-shadow:0 0 40px rgba(0,255,136,0.35);
  transition:transform 0.1s, box-shadow 0.2s;
}
#go-btn:active { transform:scale(0.97); box-shadow:0 0 20px rgba(0,255,136,0.2); }

/* ───────── GAME ───────── */
#game {
  background:#060606;
  position:relative;
  gap:0;
  justify-content:space-between;
  padding:0;
}

#timer-top {
  width:100%;
  padding:20px 28px 0;
  font-size:1rem;
  font-variant-numeric:tabular-nums;
  letter-spacing:3px;
  color:#1e1e1e;
  text-align:right;
}

#center {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  padding:0 28px;
}

#ph-word {
  font-size:6rem;
  font-weight:900;
  letter-spacing:8px;
  text-align:center;
  line-height:1;
}

#ph-secs {
  font-size:3.5rem;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  opacity:0.3;
}

#ph-taunt {
  font-size:1.15rem;
  font-weight:500;
  text-align:center;
  min-height:1.8em;
  padding:0 12px;
  opacity:0.5;
  letter-spacing:0.5px;
}

/* ───────── BAR ───────── */
#bar-wrap {
  width:100%;
  padding:0 24px 28px;
}
#bar-meta {
  display:flex;
  justify-content:space-between;
  font-size:0.68rem;
  letter-spacing:2px;
  color:#222;
  text-transform:uppercase;
  margin-bottom:8px;
}
#bar-track {
  width:100%;
  height:32px;
  background:#0e0e0e;
  border-radius:16px;
  overflow:hidden;
  position:relative;
  border:1px solid #141414;
}
#bar-fill {
  height:100%;
  width:0%;
  border-radius:16px;
  background:linear-gradient(90deg,#005cff,#9b27af);
  transition:width 0.8s ease;
  position:relative;
}
#bar-fill::after {
  content:'';
  position:absolute;
  right:0; top:0; bottom:0;
  width:4px;
  background:rgba(255,255,255,0.8);
  border-radius:0 16px 16px 0;
  box-shadow:0 0 12px 4px rgba(255,255,255,0.4);
}
#cum-mark {
  position:absolute;
  top:0; bottom:0; right:0;
  width:15%;
  background:rgba(255,215,0,0.06);
  border-left:2px dashed rgba(255,215,0,0.3);
}
#cum-mark span {
  position:absolute;
  top:50%; right:7px;
  transform:translateY(-50%);
  font-size:0.55rem;
  letter-spacing:1px;
  color:rgba(255,215,0,0.4);
  font-weight:700;
}

#quit-wrap {
  padding-bottom:24px;
}
#quit-btn {
  padding:8px 24px;
  border:1px solid #151515;
  border-radius:20px;
  background:transparent;
  color:#1c1c1c;
  font-size:0.78rem;
  letter-spacing:1px;
  cursor:pointer;
  transition:color 0.2s, border-color 0.2s;
}
#quit-btn:active { color:#333; border-color:#2a2a2a; }

/* ───────── ANIMATIONS ───────── */
@keyframes glow-go {
  0%,100% { text-shadow:0 0 20px rgba(0,255,136,0.5); transform:scale(1); }
  50%      { text-shadow:0 0 70px rgba(0,255,136,1);   transform:scale(1.05); }
}
@keyframes shake {
  0%,100%          { transform:translateX(0); }
  10%,50%,90%      { transform:translateX(-10px); }
  30%,70%          { transform:translateX(10px); }
}
@keyframes glow-cum {
  0%,100% { text-shadow:0 0 30px gold; transform:scale(1); }
  50%      { text-shadow:0 0 90px gold, 0 0 120px orange; transform:scale(1.08); }
}
@keyframes blink-denied {
  0%,100% { opacity:1; }
  50%      { opacity:0.3; }
}
@keyframes pulse-secs {
  0%,100% { transform:scale(1); }
  50%      { transform:scale(1.2); }
}

/* phase state classes on #game */
#game.s-go    #ph-word { color:#00ff88; animation:glow-go 1.2s ease-in-out infinite; }
#game.s-go    #ph-secs { color:#00ff88; }
#game.s-go    #ph-taunt { color:#00ff88; }

#game.s-stop  #ph-word { color:#ff2244; }
#game.s-stop  #ph-secs { color:#ff2244; }
#game.s-stop  #ph-taunt { color:#ff2244; }

#game.s-cumgo #ph-word { color:gold; animation:glow-cum 0.65s ease-in-out infinite; }
#game.s-cumgo #ph-secs { color:gold; animation:pulse-secs 0.65s ease-in-out infinite; }
#game.s-cumgo #ph-taunt { color:gold; opacity:0.8; }

#game.s-cumno #ph-word { color:#ff2244; animation:blink-denied 0.4s ease-in-out infinite; }
#game.s-cumno #ph-taunt { color:#ff2244; opacity:0.7; }

/* shake helper: toggling this class retriggers the animation */
.do-shake { animation:shake 0.45s ease-in-out !important; }

/* body bg tint */
body.bg-go   { background:#02100a; }
body.bg-stop { background:#10020a; }
body.bg-cumgo { background:#003320; }
body.bg-cumno { background:#330010; }

/* ───────── RESULT ───────── */
#result {
  background:#060606;
  text-align:center;
  gap:20px;
}
#res-icon  { font-size:6rem; }
#res-title { font-size:2.8rem; font-weight:900; letter-spacing:2px; }
#res-msg   { color:#444; font-size:1rem; line-height:1.9; max-width:320px; white-space:pre-line; }

#again-btn {
  margin-top:8px;
  padding:18px 52px;
  border:2px solid #1a1a1a;
  border-radius:16px;
  background:transparent;
  color:#555;
  font-size:1rem;
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
}
#again-btn:active { background:#111; color:#888; }

/* flash overlay */
#flash-overlay {
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.1s;
  z-index:999;
}
</style>
</head>
<body>

<!-- ── SETUP ── -->
<div class="screen active" id="setup">
  <div>
    <div class="logo">EDGE<br>GAME</div>
    <div class="logo-sub">ฝึกกลั้น · ไปให้สุด</div>
  </div>

  <div class="grp">
    <div class="grp-label">เล่นนานแค่ไหน?</div>
    <div class="row" id="dur">
      <div class="opt" data-v="5">ไว<small>5 นาที</small></div>
      <div class="opt on" data-v="10">พอดี<small>10 นาที</small></div>
      <div class="opt" data-v="20">ยาวนาน<small>20 นาที</small></div>
    </div>
  </div>

  <div class="grp">
    <div class="grp-label">โหดแค่ไหน?</div>
    <div class="row" id="dif">
      <div class="opt" data-v="easy">casual</div>
      <div class="opt on" data-v="normal">เริ่มยาก</div>
      <div class="opt" data-v="hard">โหด</div>
      <div class="opt" data-v="extreme">ทรมาน</div>
    </div>
  </div>

  <div class="grp">
    <div class="grp-label">อยากถึงจุดสุดยอดไหม?</div>
    <div class="row" id="cum">
      <div class="opt on" data-v="yes">อยากแตก</div>
      <div class="opt" data-v="random">ตามใจเกม</div>
      <div class="opt" data-v="no">ไม่แตก 🚫</div>
    </div>
  </div>

  <button id="go-btn">START 🔥</button>
  <div id="sound-status" style="font-size:0.7rem;color:#222;text-align:center;letter-spacing:1px;">
    🔇 กด START แล้วเสียงจะเปิด · iPad ไม่รองรับการสั่น
  </div>
</div>

<!-- ── GAME ── -->
<div class="screen" id="game">
  <div id="timer-top">--:--</div>

  <div id="center">
    <div id="ph-word">---</div>
    <div id="ph-secs">--</div>
    <div id="ph-taunt"></div>
  </div>

  <div id="bar-wrap">
    <div id="bar-meta">
      <span>EDGE</span><span id="bar-pct">0%</span>
    </div>
    <div id="bar-track">
      <div id="bar-fill"></div>
      <div id="cum-mark"><span>CUM</span></div>
    </div>
  </div>

  <div id="quit-wrap">
    <button id="quit-btn">ยอมแพ้</button>
  </div>
</div>

<!-- ── RESULT ── -->
<div class="screen" id="result">
  <div id="res-icon"></div>
  <div id="res-title"></div>
  <div id="res-msg"></div>
  <button id="again-btn">เล่นใหม่</button>
</div>

<div id="flash-overlay"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────
const DIFF = {
  easy:    { goMin:30, goMax:60,  stopMin:6,  stopMax:16, rate:0.75, drop:0.18 },
  normal:  { goMin:18, goMax:36,  stopMin:12, stopMax:28, rate:0.52, drop:0.32 },
  hard:    { goMin:9,  goMax:20,  stopMin:18, stopMax:42, rate:0.38, drop:0.48 },
  extreme: { goMin:4,  goMax:12,  stopMin:26, stopMax:58, rate:0.28, drop:0.6  },
};

const TAUNTS = {
  go: [
    'ช้าๆ อย่าแตกนะ...',
    'ทนได้ไหมเนี่ย? 👀',
    'อย่าหยุด... แต่ห้ามแตก',
    'ใกล้จุดสุดยอดแล้ว ทนหน่อย',
    'เก่งมาก... ยังไม่ถึงเวลาแตก',
    'อย่าเพิ่งแตก!! ยังไม่ได้รับอนุญาต',
    'เยี่ยม — กลั้นจุดสุดยอดไว้ก่อน',
    'เพิ่ม speed ได้ แต่ห้ามแตกเด็ดขาด',
  ],
  stop: [
    'มือออก!! ด่วน!!',
    'อย่าแตะ!!',
    'กล้าแตะมั้ย? 😈',
    'ทนดูซิ...',
    'หายใจลึกๆ ห้ามแตก',
    'วางลง!! เดี๋ยวนี้!!',
    'จุดสุดยอดยังไม่ถึง — มือออก!!',
  ],
};

// ─── STATE ────────────────────────────────────────────────────────────────
let cfg = { dur:10, dif:'normal', cum:'yes' };
let tGame, tPhase, tEdge;
let totalLeft, phaseLeft, edgePct = 0;
let phase = 'idle';
let inCum = false, cumDone = false;
let audioCtx = null;

// ─── AUDIO ────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // unlock iOS: play a silent buffer immediately inside the user-gesture stack
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, dur, type='sine', vol=0.28, delay=0) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now); o.stop(now + dur);
  } catch(e) {}
}

const SFX = {
  go()     { tone(440,.12,'sine',.25); tone(660,.2,'sine',.2,.1); },
  stop()   { tone(160,.5,'sawtooth',.4); },
  tick()   { tone(900,.05,'sine',.12); },
  cumgo()  { tone(660,.18,'sine',.4); tone(880,.18,'sine',.4,.1); tone(1100,.3,'sine',.4,.22); },
  denied() { tone(300,.25,'sawtooth',.4); tone(180,.7,'sawtooth',.35,.2); },
  warn()   { tone(550,.08,'sine',.2); tone(420,.08,'sine',.15,.15); },
};

// ─── VIBRATE ──────────────────────────────────────────────────────────────
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

// ─── UTILS ────────────────────────────────────────────────────────────────
const rand  = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick  = arr  => arr[Math.floor(Math.random()*arr.length)];
const fmt   = s    => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

function flash(color, ms=220) {
  const el = document.getElementById('flash-overlay');
  el.style.background = color;
  el.style.opacity = '0.45';
  setTimeout(()=>{ el.style.opacity='0'; }, ms);
}

// ─── OPTION BUTTONS ───────────────────────────────────────────────────────
['dur','dif','cum'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b) return;
    b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
});

// ─── SCREEN SWITCH ────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── START ────────────────────────────────────────────────────────────────
document.getElementById('go-btn').addEventListener('click', () => {
  initAudio();
  // play test beep so user knows audio is unlocked
  tone(440, 0.08, 'sine', 0.15);
  cfg.dur = parseInt(document.querySelector('#dur .on').dataset.v);
  cfg.dif = document.querySelector('#dif .on').dataset.v;
  cfg.cum = document.querySelector('#cum .on').dataset.v;
  startGame();
});

document.getElementById('quit-btn').addEventListener('click', () => end('quit'));
document.getElementById('again-btn').addEventListener('click', () => {
  document.body.className='';
  show('setup');
});

// tap during cum-go = confirm cum
document.getElementById('game').addEventListener('click', e => {
  if (e.target.id === 'quit-btn') return;
  if (phase === 'cumgo') { clearAll(); showResult('success'); }
});

// ─── GAME ─────────────────────────────────────────────────────────────────
function startGame() {
  edgePct=0; inCum=false; cumDone=false;
  totalLeft = cfg.dur * 60;
  show('game');
  setBar();
  globalTick();
  startPhase('go');
  edgeTick();
}

function globalTick() {
  clearInterval(tGame);
  tGame = setInterval(()=>{
    totalLeft--;
    document.getElementById('timer-top').textContent = fmt(totalLeft);
    if (totalLeft<=0) {
      clearInterval(tGame);
      if (!cumDone && phase!=='cumgo' && phase!=='cumno') {
        inCum ? decideCum() : end('quit');
      }
    }
  },1000);
}

function startPhase(p) {
  clearInterval(tPhase);
  phase = p;
  const d = DIFF[cfg.dif];
  const gEl = document.getElementById('game');

  let secs, word, taunt;

  if (p==='go') {
    secs  = rand(d.goMin, d.goMax);
    word  = 'GO';
    taunt = pick(TAUNTS.go);
    gEl.className = 'screen active s-go';
    document.body.className = 'bg-go';
    flash('#00ff88',180);
    SFX.go(); vib(40);

  } else if (p==='stop') {
    secs  = rand(d.stopMin, d.stopMax);
    word  = 'STOP';
    taunt = pick(TAUNTS.stop);
    // retrigger shake
    const w = document.getElementById('ph-word');
    w.classList.remove('do-shake');
    void w.offsetWidth;
    gEl.className = 'screen active s-stop';
    w.classList.add('do-shake');
    document.body.className = 'bg-stop';
    flash('#ff2244',180);
    SFX.stop(); vib([220,80,220]);

  } else if (p==='cumgo') {
    secs  = rand(12,20);
    word  = 'CUM!!';
    taunt = `แตะหน้าจอเพื่อถึงจุดสุดยอด — เหลือ ${secs} วิ!!`;
    gEl.className = 'screen active s-cumgo';
    document.body.className = 'bg-cumgo';
    flash('#00ff88',600);
    SFX.cumgo(); vib([80,40,80,40,80,40,200]);

  } else if (p==='cumno') {
    secs  = 6;
    word  = 'NO!!';
    taunt = 'ไม่ใช่วันนี้ 😈 มือออก!!';
    gEl.className = 'screen active s-cumno';
    document.body.className = 'bg-cumno';
    flash('#ff2244',600);
    SFX.denied(); vib(700);
  }

  document.getElementById('ph-word').textContent = word;
  document.getElementById('ph-taunt').textContent = taunt;
  phaseLeft = secs;
  document.getElementById('ph-secs').textContent = phaseLeft;

  tPhase = setInterval(()=>{
    phaseLeft--;
    document.getElementById('ph-secs').textContent = phaseLeft;
    if (phaseLeft<=5 && phaseLeft>0) { SFX.tick(); vib(15); }
    // surprise stop while going — random chance at 3s left
    if (p==='go' && phaseLeft===3 && edgePct>50 && Math.random()<0.2) {
      SFX.warn();
    }
    if (phaseLeft<=0) { clearInterval(tPhase); onEnd(p); }
  },1000);
}

function onEnd(p) {
  if (p==='cumgo') { end('ruin'); return; }
  if (p==='cumno') { end('denied'); return; }
  if (inCum && !cumDone && edgePct>=85) { decideCum(); return; }
  startPhase(p==='go' ? 'stop' : 'go');
}

function decideCum() {
  if (cumDone) return;
  cumDone = true;
  clearInterval(tGame);
  const will = cfg.cum==='yes' ? true : cfg.cum==='no' ? false : Math.random()<0.6;
  startPhase(will ? 'cumgo' : 'cumno');
}

function edgeTick() {
  clearInterval(tEdge);
  tEdge = setInterval(()=>{
    const d = DIFF[cfg.dif];
    if (phase==='go')   edgePct = Math.min(100, edgePct+d.rate);
    if (phase==='stop') edgePct = Math.max(0,   edgePct-d.drop);
    setBar();
    if (edgePct>=85 && !inCum) inCum = true;
    if (!totalLeft && inCum && !cumDone && phase!=='cumgo' && phase!=='cumno') decideCum();
  },800);
}

function setBar() {
  const fill = document.getElementById('bar-fill');
  fill.style.width = edgePct+'%';
  document.getElementById('bar-pct').textContent = Math.round(edgePct)+'%';
  if (edgePct>=85)
    fill.style.background = 'linear-gradient(90deg,#7b00ff,#ff1744,gold)';
  else if (edgePct>=55)
    fill.style.background = 'linear-gradient(90deg,#005cff,#c2185b)';
  else
    fill.style.background = 'linear-gradient(90deg,#005cff,#7b00ff)';
}

function clearAll() {
  clearInterval(tGame); clearInterval(tPhase); clearInterval(tEdge);
}

function end(type) { clearAll(); showResult(type); }

function showResult(type) {
  document.body.className='';
  const R = {
    success: { icon:'🎉', title:'แตกแล้ว!!',  msg:'ถึงจุดสุดยอดสำเร็จ 🔥\nครั้งหน้าลองเพิ่ม level หรือเวลาขึ้นอีกนะ 😏' },
    ruin:    { icon:'😤', title:'RUINED',    msg:'หมดเวลา — เอามือออก แล้วให้แตกเองนะ\nนั่นแหละคือจุดสุดยอดแบบรูน 💀\nครั้งหน้าต้องทำให้ดีกว่านี้' },
    denied:  { icon:'😈', title:'DENIED!!',  msg:'ไม่ได้แตกวันนี้ bro\nความอยากที่ค้างไว้จะทำให้\nครั้งถัดไปถึงจุดสุดยอดแรงกว่าเดิม 🔥' },
    quit:    { icon:'🏳️',  title:'ยอมแพ้',   msg:'แค่นี้เองเหรอ?\nลองใหม่แล้วทนจุดสุดยอดให้นานกว่านี้ 🙄' },
  };
  const r = R[type]||R.quit;
  document.getElementById('res-icon').textContent  = r.icon;
  document.getElementById('res-title').textContent = r.title;
  document.getElementById('res-msg').textContent   = r.msg;
  show('result');
}
</script>
</body>
</html>
