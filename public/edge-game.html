<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EDGE GAME</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

html { height:100%; }

body {
  font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:#060606;
  color:#f0f0f0;
  height:100%;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:background 0.4s;
}

/* ───────── SCREENS ───────── */
.screen {
  position:fixed; inset:0;
  display:none;
}
.screen.active { display:flex; }

/* ───────── SETUP ───────── */
#setup {
  flex-direction:column;
  align-items:center;
  justify-content:safe center;
  overflow-y:auto;
  overflow-x:hidden;
  background:#060606;
  padding: clamp(20px,4vh,48px) clamp(16px,5vw,48px);
  gap: clamp(12px,2.2vh,24px);
}

/* max-width container for wide screens */
#setup > * { width:100%; max-width:540px; }

.logo {
  font-size: clamp(2.8rem,9vmin,6rem);
  font-weight:900;
  letter-spacing: clamp(4px,1.2vw,10px);
  line-height:1;
  text-align:center;
  background:linear-gradient(135deg,#00ff88 0%,#00d4ff 50%,#bf5fff 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo-sub {
  text-align:center;
  font-size: clamp(0.6rem,1.5vmin,0.8rem);
  letter-spacing:3px;
  color:#333;
  text-transform:uppercase;
  margin-top:6px;
}

.grp { width:100%; }
.grp-label {
  font-size: clamp(0.58rem,1.4vmin,0.72rem);
  letter-spacing:2.5px;
  color:#444;
  text-transform:uppercase;
  margin-bottom: clamp(6px,1.2vh,12px);
}
.row { display:flex; gap: clamp(5px,1.2vw,10px); }

.opt {
  flex:1;
  padding: clamp(10px,1.8vh,18px) clamp(4px,1vw,8px);
  border:2px solid #1a1a1a;
  border-radius: clamp(10px,1.8vw,16px);
  background:#0e0e0e;
  color:#555;
  cursor:pointer;
  font-size: clamp(0.75rem,2vmin,1rem);
  font-weight:600;
  text-align:center;
  line-height:1.5;
  transition:border-color 0.2s,color 0.2s,background 0.2s;
}
.opt small {
  display:block;
  font-size: clamp(0.58rem,1.4vmin,0.72rem);
  font-weight:400;
  color:#333;
}
.opt.on { border-color:#00ff88; color:#00ff88; background:#001a0e; }

#go-btn {
  width:100%;
  padding: clamp(16px,2.8vh,26px);
  font-size: clamp(1rem,3vmin,1.4rem);
  font-weight:900;
  border:none;
  border-radius: clamp(12px,2vw,18px);
  background:#00ff88;
  color:#000;
  cursor:pointer;
  letter-spacing:4px;
  text-transform:uppercase;
  box-shadow:0 0 40px rgba(0,255,136,0.35);
  transition:transform 0.1s,box-shadow 0.2s;
}
#go-btn:active { transform:scale(0.97); box-shadow:0 0 20px rgba(0,255,136,0.2); }

#sound-status {
  font-size: clamp(0.58rem,1.4vmin,0.72rem);
  color:#1e1e1e;
  text-align:center;
  letter-spacing:1px;
}

/* ───────── GAME ───────── */
#game {
  flex-direction:column;
  justify-content:space-between;
  align-items:stretch;
  background:#060606;
}

#timer-top {
  padding: clamp(14px,2.5vh,24px) clamp(20px,4vw,40px) 0;
  font-size: clamp(0.85rem,2.5vmin,1.2rem);
  font-variant-numeric:tabular-nums;
  letter-spacing:3px;
  color:#1e1e1e;
  text-align:right;
}

#center {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap: clamp(6px,1.8vh,18px);
  padding:0 clamp(16px,4vw,48px);
}

#ph-word {
  /* vmin ทำให้ scale ดีทั้ง portrait และ landscape */
  font-size: clamp(4rem,22vmin,16rem);
  font-weight:900;
  letter-spacing: clamp(4px,2vmin,18px);
  text-align:center;
  line-height:1;
}

#ph-secs {
  font-size: clamp(2.2rem,11vmin,8rem);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  opacity:0.3;
}

#ph-taunt {
  font-size: clamp(0.95rem,3.5vmin,2rem);
  font-weight:500;
  text-align:center;
  min-height:1.8em;
  padding:0 clamp(8px,3vw,24px);
  opacity:0.55;
  letter-spacing:0.5px;
  line-height:1.5;
}

/* ───────── BAR ───────── */
#bar-wrap {
  padding:0 clamp(16px,4vw,40px) clamp(18px,3.5vh,40px);
}
#bar-meta {
  display:flex;
  justify-content:space-between;
  font-size: clamp(0.58rem,1.5vmin,0.78rem);
  letter-spacing:2px;
  color:#222;
  text-transform:uppercase;
  margin-bottom: clamp(6px,1.2vh,12px);
}
#bar-track {
  width:100%;
  height: clamp(22px,5vmin,50px);
  background:#0e0e0e;
  border-radius:100px;
  overflow:hidden;
  position:relative;
  border:1px solid #141414;
}
#bar-fill {
  height:100%;
  width:0%;
  border-radius:100px;
  background:linear-gradient(90deg,#005cff,#9b27af);
  transition:width 0.8s ease;
  position:relative;
}
#bar-fill::after {
  content:'';
  position:absolute;
  right:0; top:0; bottom:0;
  width: clamp(3px,0.6vmin,6px);
  background:rgba(255,255,255,0.85);
  border-radius:0 100px 100px 0;
  box-shadow:0 0 14px 5px rgba(255,255,255,0.4);
}
#cum-mark {
  position:absolute;
  top:0; bottom:0; right:0;
  width:15%;
  background:rgba(255,215,0,0.06);
  border-left:2px dashed rgba(255,215,0,0.3);
}
#cum-mark span {
  position:absolute;
  top:50%; right: clamp(4px,1vw,10px);
  transform:translateY(-50%);
  font-size: clamp(0.48rem,1.2vmin,0.68rem);
  letter-spacing:1px;
  color:rgba(255,215,0,0.4);
  font-weight:700;
}

#quit-wrap { text-align:center; padding-bottom: clamp(14px,3vh,36px); }
#quit-btn {
  padding: clamp(6px,1.2vh,12px) clamp(16px,4vw,32px);
  border:1px solid #151515;
  border-radius:20px;
  background:transparent;
  color:#1c1c1c;
  font-size: clamp(0.68rem,1.8vmin,0.9rem);
  letter-spacing:1px;
  cursor:pointer;
  transition:color 0.2s,border-color 0.2s;
}
#quit-btn:active { color:#333; border-color:#2a2a2a; }

/* ───────── ANIMATIONS ───────── */
@keyframes glow-go {
  0%,100% { text-shadow:0 0 20px rgba(0,255,136,0.5); transform:scale(1); }
  50%      { text-shadow:0 0 80px rgba(0,255,136,1);   transform:scale(1.05); }
}
@keyframes shake {
  0%,100%     { transform:translateX(0); }
  15%,55%,85% { transform:translateX(-8px); }
  35%,70%     { transform:translateX(8px); }
}
@keyframes glow-cum {
  0%,100% { text-shadow:0 0 30px gold; transform:scale(1); }
  50%      { text-shadow:0 0 100px gold,0 0 140px orange; transform:scale(1.08); }
}
@keyframes blink-denied {
  0%,100% { opacity:1; }
  50%      { opacity:0.25; }
}
@keyframes pulse-secs {
  0%,100% { transform:scale(1); }
  50%      { transform:scale(1.2); }
}

#game.s-go    #ph-word  { color:#00ff88; animation:glow-go 1.2s ease-in-out infinite; }
#game.s-go    #ph-secs  { color:#00ff88; }
#game.s-go    #ph-taunt { color:#00ff88; }

#game.s-stop  #ph-word  { color:#ff2244; }
#game.s-stop  #ph-secs  { color:#ff2244; }
#game.s-stop  #ph-taunt { color:#ff2244; }

#game.s-cumgo #ph-word  { color:gold; animation:glow-cum 0.65s ease-in-out infinite; }
#game.s-cumgo #ph-secs  { color:gold; animation:pulse-secs 0.65s ease-in-out infinite; }
#game.s-cumgo #ph-taunt { color:gold; opacity:0.85; }

#game.s-cumno #ph-word  { color:#ff2244; animation:blink-denied 0.4s ease-in-out infinite; }
#game.s-cumno #ph-taunt { color:#ff2244; opacity:0.75; }

.do-shake { animation:shake 0.45s ease-in-out !important; }

body.bg-go    { background:#02100a; }
body.bg-stop  { background:#10020a; }
body.bg-cumgo { background:#003320; }
body.bg-cumno { background:#330010; }

/* ───────── RESULT ───────── */
#result {
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap: clamp(12px,2.5vh,28px);
  padding: clamp(24px,5vw,60px);
  background:#060606;
}
#res-icon  { font-size: clamp(4rem,12vmin,8rem); }
#res-title { font-size: clamp(2rem,7vmin,4rem); font-weight:900; letter-spacing:2px; }
#res-msg   { color:#444; font-size: clamp(0.9rem,2.5vmin,1.25rem); line-height:1.9; max-width:480px; white-space:pre-line; }

#again-btn {
  padding: clamp(14px,2.5vh,22px) clamp(36px,8vw,64px);
  border:2px solid #1a1a1a;
  border-radius: clamp(12px,2vw,18px);
  background:transparent;
  color:#555;
  font-size: clamp(0.88rem,2.5vmin,1.1rem);
  font-weight:700;
  letter-spacing:3px;
  text-transform:uppercase;
  cursor:pointer;
  transition:all 0.2s;
}
#again-btn:active { background:#111; color:#888; }

/* ───────── FLASH ───────── */
#flash-overlay {
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.1s;
  z-index:999;
}
</style>
</head>
<body>

<!-- ── SETUP ── -->
<div class="screen active" id="setup">

</div>

<!-- ── GAME ── -->
<div class="screen" id="game">

    <div id="bar-track">

    </div>
  </div>

  <div id="quit-wrap">
    <button id="quit-btn">ยอมแพ้</button>
  </div>
</div>

<!-- ── RESULT ── -->
<div class="screen" id="result">
  <div id="res-icon"></div>
  <div id="res-title"></div>
  <div id="res-msg"></div>
  <button id="again-btn">เล่นใหม่</button>
</div>

<div id="flash-overlay"></div>

// ─── STATE ────────────────────────────────────────────────────────────────
let cfg = { dur:10, dif:'normal', cum:'yes', voice:'lover' };
let tGame, tPhase, tEdge;
let totalLeft, phaseLeft, edgePct = 0;
let phase = 'idle';
let inCum = false, cumDone = false;
let audioCtx = null;

// ─── AUDIO ────────────────────────────────────────────────────────────────
function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // unlock iOS: play a silent buffer immediately inside the user-gesture stack
  const buf = audioCtx.createBuffer(1, 1, 22050);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start(0);
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function tone(freq, dur, type='sine', vol=0.28, delay=0) {
  if (!audioCtx) return;
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime + delay;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + dur);
    o.start(now); o.stop(now + dur);
  } catch(e) {}
}

const SFX = {
  go()     { tone(440,.12,'sine',.25); tone(660,.2,'sine',.2,.1); },
  stop()   { tone(160,.5,'sawtooth',.4); },
  tick()   { tone(900,.05,'sine',.12); },
  cumgo()  { tone(660,.18,'sine',.4); tone(880,.18,'sine',.4,.1); tone(1100,.3,'sine',.4,.22); },
  denied() { tone(300,.25,'sawtooth',.4); tone(180,.7,'sawtooth',.35,.2); },
  warn()   { tone(550,.08,'sine',.2); tone(420,.08,'sine',.15,.15); },
};

// ─── VIBRATE ──────────────────────────────────────────────────────────────
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

// ─── UTILS ────────────────────────────────────────────────────────────────
const rand     = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick     = arr  => arr[Math.floor(Math.random()*arr.length)];
const fmt      = s    => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
const getStage = ()   => edgePct < 40 ? 'early' : edgePct < 72 ? 'mid' : 'late';

function flash(color, ms=220) {
  const el = document.getElementById('flash-overlay');
  el.style.background = color;
  el.style.opacity = '0.45';
  setTimeout(()=>{ el.style.opacity='0'; }, ms);
}

// ─── OPTION BUTTONS ───────────────────────────────────────────────────────
['dur','dif','cum','voice'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (!b) return;
    b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
});

// ─── SCREEN SWITCH ────────────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── START ────────────────────────────────────────────────────────────────
document.getElementById('go-btn').addEventListener('click', () => {
  initAudio();
  // play test beep so user knows audio is unlocked
  tone(440, 0.08, 'sine', 0.15);
  cfg.dur   = parseInt(document.querySelector('#dur .on').dataset.v);
  cfg.dif   = document.querySelector('#dif .on').dataset.v;
  cfg.cum   = document.querySelector('#cum .on').dataset.v;
  cfg.voice = document.querySelector('#voice .on').dataset.v;
  startGame();
});

document.getElementById('quit-btn').addEventListener('click', () => end('quit'));
document.getElementById('again-btn').addEventListener('click', () => {
  document.body.className='';
  show('setup');
});

// tap during cum-go = confirm cum
document.getElementById('game').addEventListener('click', e => {
  if (e.target.id === 'quit-btn') return;
  if (phase === 'cumgo') { clearAll(); showResult('success'); }
});

// ─── GAME ─────────────────────────────────────────────────────────────────
function startGame() {
  edgePct=0; inCum=false; cumDone=false;
  totalLeft = cfg.dur * 60;
  show('game');
  setBar();
  globalTick();
  startPhase('go');
  edgeTick();
}

function globalTick() {
  clearInterval(tGame);
  tGame = setInterval(()=>{
    totalLeft--;
    document.getElementById('timer-top').textContent = fmt(totalLeft);
    if (totalLeft<=0) {
      clearInterval(tGame);
      if (!cumDone && phase!=='cumgo' && phase!=='cumno') {
        inCum ? decideCum() : end('quit');
      }
    }
  },1000);
}

function startPhase(p) {
  clearInterval(tPhase);
  phase = p;
  const d = DIFF[cfg.dif];
  const gEl = document.getElementById('game');

  let secs, word, taunt;

  const V = VOICES[cfg.voice];

  if (p==='go') {
    secs  = rand(d.goMin, d.goMax);
    word  = 'GO';
    taunt = pick(V.go[getStage()]);
    gEl.className = 'screen active s-go';
    document.body.className = 'bg-go';
    flash('#00ff88',180);
    SFX.go(); vib(40);

  } else if (p==='stop') {
    secs  = rand(d.stopMin, d.stopMax);
    word  = 'STOP';
    taunt = pick(V.stop[getStage()]);
    const w = document.getElementById('ph-word');
    w.classList.remove('do-shake');
    void w.offsetWidth;
    gEl.className = 'screen active s-stop';
    w.classList.add('do-shake');
    document.body.className = 'bg-stop';
    flash('#ff2244',180);
    SFX.stop(); vib([220,80,220]);

  } else if (p==='cumgo') {
    secs  = rand(12,20);
    word  = 'แตก!!';
    taunt = V.cumgo(secs);
    gEl.className = 'screen active s-cumgo';
    document.body.className = 'bg-cumgo';
    flash('#00ff88',600);
    SFX.cumgo(); vib([80,40,80,40,80,40,200]);

  } else if (p==='cumno') {
    secs  = 6;
    word  = 'NO!!';
    taunt = V.cumno;
    gEl.className = 'screen active s-cumno';
    document.body.className = 'bg-cumno';
    flash('#ff2244',600);
    SFX.denied(); vib(700);
  }

  document.getElementById('ph-word').textContent = word;
  document.getElementById('ph-taunt').textContent = taunt;
  phaseLeft = secs;
  document.getElementById('ph-secs').textContent = phaseLeft;

  tPhase = setInterval(()=>{
    phaseLeft--;
    document.getElementById('ph-secs').textContent = phaseLeft;
    if (phaseLeft<=5 && phaseLeft>0) { SFX.tick(); vib(15); }
    // surprise stop while going — random chance at 3s left
    if (p==='go' && phaseLeft===3 && edgePct>50 && Math.random()<0.2) {
      SFX.warn();
    }
    if (phaseLeft<=0) { clearInterval(tPhase); onEnd(p); }
  },1000);
}

function onEnd(p) {
  if (p==='cumgo') { end('ruin'); return; }
  if (p==='cumno') { end('denied'); return; }
  if (inCum && !cumDone && edgePct>=85) { decideCum(); return; }
  startPhase(p==='go' ? 'stop' : 'go');
}

function decideCum() {
  if (cumDone) return;
  cumDone = true;
  clearInterval(tGame);
  const will = cfg.cum==='yes' ? true : cfg.cum==='no' ? false : Math.random()<0.6;
  startPhase(will ? 'cumgo' : 'cumno');
}

function edgeTick() {
  clearInterval(tEdge);
  tEdge = setInterval(()=>{
    const d = DIFF[cfg.dif];
    if (phase==='go')   edgePct = Math.min(100, edgePct+d.rate);
    if (phase==='stop') edgePct = Math.max(0,   edgePct-d.drop);
    setBar();
    if (edgePct>=85 && !inCum) inCum = true;
    if (!totalLeft && inCum && !cumDone && phase!=='cumgo' && phase!=='cumno') decideCum();
  },800);
}

function setBar() {
  const fill = document.getElementById('bar-fill');
  fill.style.width = edgePct+'%';
  document.getElementById('bar-pct').textContent = Math.round(edgePct)+'%';
  if (edgePct>=85)
    fill.style.background = 'linear-gradient(90deg,#7b00ff,#ff1744,gold)';
  else if (edgePct>=55)
    fill.style.background = 'linear-gradient(90deg,#005cff,#c2185b)';
  else
    fill.style.background = 'linear-gradient(90deg,#005cff,#7b00ff)';
}

function clearAll() {
  clearInterval(tGame); clearInterval(tPhase); clearInterval(tEdge);
}

function end(type) { clearAll(); showResult(type); }

function showResult(type) {
  document.body.className='';
  const R = VOICES[cfg.voice].results;
  const r = R[type] || R.quit;
  document.getElementById('res-icon').textContent  = r.icon;
  document.getElementById('res-title').textContent = r.title;
  document.getElementById('res-msg').textContent   = r.msg;
  show('result');
}
</script>
