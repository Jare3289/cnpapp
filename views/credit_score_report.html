<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>รายงานสรุปคะแนนพฤติกรรม | CNP APP</title>
    <meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .report-card { border-radius: 20px; border: none; transition: 0.3s; }
        .table-report { font-size: 0.9rem; }
        .table-report thead th { background-color: #f8fafc; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; border-bottom: 2px solid #e2e8f0; padding: 15px; }
        .table-report tbody td { padding: 15px; vertical-align: middle; border-bottom: 1px solid #f1f5f9; }
        
        .rank-badge { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; }
        .rank-1 { background-color: #fef3c7; color: #b45309; border: 2px solid #f59e0b; }
        .rank-2 { background-color: #f1f5f9; color: #475569; border: 2px solid #94a3b8; }
        .rank-3 { background-color: #fff7ed; color: #9a3412; border: 2px solid #ea580c; }
        
        .score-pill { padding: 6px 15px; border-radius: 50px; font-weight: 800; font-size: 1rem; }
        .score-high { background-color: #dcfce7; color: #15803d; }
        .score-low { background-color: #fee2e2; color: #b91c1c; }
        .score-mid { background-color: #f1f5f9; color: #475569; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar" id="mainSidebar"></div>

        <main class="app-main main-panel d-flex flex-column min-vh-100" style="background-color: #f8fafc;" id="main">
            <div class="app-content-header main-header sticky-top bg-white border-bottom shadow-sm">
                <div class="container-fluid d-flex align-items-center justify-content-between py-2">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-link text-navy d-lg-none px-0" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                        <h5 class="mb-0 fw-bold"><i class="bi bi-file-earmark-bar-graph-fill text-info me-2"></i>รายงานสรุปคะแนนพฤติกรรม</h5>
                    </div>
                </div>
            </div>

            <div class="app-content page-content content-padding py-4">
                <div class="container-fluid">
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <div class="card report-card shadow-sm h-100 bg-white">
                                <div class="card-body p-4">
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <h6 class="fw-bold mb-0 text-success"><i class="bi bi-graph-up me-2"></i>นักเรียนที่มีคะแนนบวกสูงสุด</h6>
                                        <button class="btn btn-sm btn-light rounded-pill px-3" onclick="loadReport()">รีเฟรช</button>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-report">
                                            <thead>
                                                <tr>
                                                    <th>อันดับ</th>
                                                    <th>ชื่อ-นามสกุล</th>
                                                    <th class="text-center">คะแนนรวม</th>
                                                </tr>
                                            </thead>
                                            <tbody id="topStudentsBody">
                                                <!-- Data -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card report-card shadow-sm h-100 bg-white">
                                <div class="card-body p-4">
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <h6 class="fw-bold mb-0 text-danger"><i class="bi bi-graph-down me-2"></i>นักเรียนที่มีคะแนนติดลบสูงสุด</h6>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table table-report">
                                            <thead>
                                                <tr>
                                                    <th>อันดับ</th>
                                                    <th>ชื่อ-นามสกุล</th>
                                                    <th class="text-center">คะแนนรวม</th>
                                                </tr>
                                            </thead>
                                            <tbody id="bottomStudentsBody">
                                                <!-- Data -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../public/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth('admin');
            loadReport();
        });

        async function loadReport() {
            try {
                const res = await fetch('../api/admin/credit_score_report.php');
                const data = await res.json();
                if(data.success) {
                    renderTop(data.data);
                    renderBottom(data.data);
                }
            } catch (err) { console.error(err); }
        }

        function renderTop(data) {
            const body = document.getElementById('topStudentsBody');
            const topData = [...data].sort((a,b) => b.total_points - a.total_points).slice(0, 5);
            
            body.innerHTML = topData.map((row, idx) => `
                <tr>
                    <td><div class="rank-badge rank-${idx+1}">${idx+1}</div></td>
                    <td>
                        <div class="fw-bold">${row.prefix}${row.first_name_th} ${row.last_name_th}</div>
                        <div class="x-small text-muted">${row.student_id} | ห้อง ${row.room}</div>
                    </td>
                    <td class="text-center"><span class="score-pill score-high">${row.total_points}</span></td>
                </tr>
            `).join('');
        }

        function renderBottom(data) {
            const body = document.getElementById('bottomStudentsBody');
            const bottomData = [...data].sort((a,b) => a.total_points - b.total_points).slice(0, 5);
            
            body.innerHTML = bottomData.map((row, idx) => `
                <tr>
                    <td><div class="rank-badge ${idx < 3 ? 'rank-' + (idx+1) : 'bg-light text-muted'}">${idx+1}</div></td>
                    <td>
                        <div class="fw-bold">${row.prefix}${row.first_name_th} ${row.last_name_th}</div>
                        <div class="x-small text-muted">${row.student_id} | ห้อง ${row.room}</div>
                    </td>
                    <td class="text-center"><span class="score-pill score-low">${row.total_points}</span></td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
