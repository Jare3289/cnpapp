<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>ตั้งค่าระบบคะแนน | CNP APP</title>
    <meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <style>
        .settings-card { border-radius: 20px; border: none; }
        .table-settings { font-size: 0.9rem; }
        .table-settings thead th { background-color: #f1f5f9; color: #475569; font-weight: 700; border: none; padding: 12px; }
        .table-settings tbody td { padding: 12px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        
        .cat-group { background-color: #f8fafc; border-left: 4px solid #1e293b; padding: 10px 15px; font-weight: bold; margin-top: 20px; }
        .btn-add { background: #1e293b; color: white; border-radius: 10px; padding: 8px 20px; font-weight: 600; }
        .btn-add:hover { background: #0f172a; color: white; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar" id="mainSidebar"></div>

        <main class="app-main main-panel d-flex flex-column min-vh-100" style="background-color: #f8fafc;" id="main">
            <div class="app-content-header main-header sticky-top bg-white border-bottom shadow-sm">
                <div class="container-fluid d-flex align-items-center justify-content-between py-2">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-link text-navy d-lg-none px-0" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                        <h5 class="mb-0 fw-bold"><i class="bi bi-gear-fill text-secondary me-2"></i>ตั้งค่าเกณฑ์คะแนนพฤติกรรม</h5>
                    </div>
                    <button class="btn btn-add shadow-sm" onclick="openItemModal()"><i class="bi bi-plus-lg me-2"></i>เพิ่มรายการใหม่</button>
                </div>
            </div>

            <div class="app-content page-content content-padding py-4">
                <div class="container-fluid">
                    
                    <div class="card settings-card shadow-sm p-4 bg-white">
                        <div id="settingsContainer">
                            <!-- Injected via JS -->
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="itemModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4">
                <div class="modal-header">
                    <h5 class="fw-bold" id="modalTitle">เพิ่ม/แก้ไข รายการคะแนน</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="itemId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">หมวดหมู่</label>
                        <select id="catSelect" class="form-select rounded-3"></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">ชื่อรายการ</label>
                        <input type="text" id="itemName" class="form-control rounded-3" placeholder="เช่น ช่วยเหลืองานโรงเรียน">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">จำนวนคะแนน (ใช้เครื่องหมาย - สำหรับหักคะแนน)</label>
                        <input type="number" id="itemPoints" class="form-control rounded-3" value="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">ยกเลิก</button>
                    <button type="button" class="btn btn-primary rounded-pill px-4" onclick="saveItem()">บันทึกข้อมูล</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../public/js/main.js"></script>
    <script>
        let categories = [];
        let items = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth('admin');
            loadSettings();
        });

        async function loadSettings() {
            try {
                const res = await fetch('../api/admin/credit_score_settings.php?action=list');
                const data = await res.json();
                if(data.success) {
                    categories = data.categories;
                    items = data.items;
                    renderSettings();
                    
                    const select = document.getElementById('catSelect');
                    select.innerHTML = categories.map(c => `<option value="${c.id}">${c.category_name}</option>`).join('');
                }
            } catch (err) { console.error(err); }
        }

        function renderSettings() {
            const container = document.getElementById('settingsContainer');
            container.innerHTML = '';

            categories.forEach(cat => {
                const catItems = items.filter(i => i.category_id === cat.id);
                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="cat-group">${cat.category_name}</div>
                    <div class="table-responsive">
                        <table class="table table-settings">
                            <thead>
                                <tr>
                                    <th style="width: 60%;">รายการ</th>
                                    <th class="text-center">คะแนน</th>
                                    <th class="text-end">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${catItems.map(item => `
                                    <tr>
                                        <td>${item.item_name}</td>
                                        <td class="text-center fw-bold ${item.points >= 0 ? 'text-success' : 'text-danger'}">${item.points >= 0 ? '+' + item.points : item.points}</td>
                                        <td class="text-end">
                                            <button class="btn btn-sm btn-outline-primary rounded-pill me-1" onclick="editItem(${item.id})"><i class="bi bi-pencil"></i></button>
                                            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="deleteItem(${item.id})"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                                ${catItems.length === 0 ? '<tr><td colspan="3" class="text-center text-muted py-3 small">ยังไม่มีรายการในหมวดนี้</td></tr>' : ''}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function openItemModal() {
            document.getElementById('itemId').value = '';
            document.getElementById('itemName').value = '';
            document.getElementById('itemPoints').value = 1;
            document.getElementById('modalTitle').innerText = 'เพิ่มรายการใหม่';
            new bootstrap.Modal(document.getElementById('itemModal')).show();
        }

        function editItem(id) {
            const item = items.find(i => i.id === id);
            if(!item) return;
            document.getElementById('itemId').value = item.id;
            document.getElementById('catSelect').value = item.category_id;
            document.getElementById('itemName').value = item.item_name;
            document.getElementById('itemPoints').value = item.points;
            document.getElementById('modalTitle').innerText = 'แก้ไขรายการ';
            new bootstrap.Modal(document.getElementById('itemModal')).show();
        }

        async function saveItem() {
            const id = document.getElementById('itemId').value;
            const category_id = document.getElementById('catSelect').value;
            const item_name = document.getElementById('itemName').value;
            const points = document.getElementById('itemPoints').value;

            if(!item_name) return alert('กรุณาระบุชื่อรายการ');

            try {
                const res = await fetch('../api/admin/credit_score_settings.php?action=save_item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, category_id, item_name, points })
                });
                if((await res.json()).success) {
                    bootstrap.Modal.getInstance(document.getElementById('itemModal')).hide();
                    loadSettings();
                }
            } catch (err) { console.error(err); }
        }

        async function deleteItem(id) {
            if(!confirm('คุณแน่ใจว่าต้องการลบรายการนี้?')) return;
            try {
                const res = await fetch(`../api/admin/credit_score_settings.php?action=delete_item&id=${id}`);
                if((await res.json()).success) loadSettings();
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
