<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>โปรไฟล์นักเรียน | CNP APP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/notion.css">
    <style>
        body { font-family: 'Google Sans', sans-serif; background-color: #f8fafc; }
        .student-card { border-radius: 20px; border: none; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .card-header-student { background: linear-gradient(45deg, #0d6efd, #00d2ff); color: white; padding: 30px; text-align: center; }
        .student-avatar { width: 120px; height: 120px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.3); object-fit: cover; background: white; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="sidebar" id="mainSidebar"></div>
        <main class="app-main main-panel d-flex flex-column min-vh-100 d-flex flex-column min-vh-100" style="background-color: #f8fafc;" id="main" tabindex="-1">
            <div class="app-content page-content py-5 flex-grow-1 d-flex flex-column py-4 flex-grow-1 d-flex flex-column">
                <div class="container">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card student-card">
                                <div class="card-header-student">
                                    <img id="displayAvatar" src="../public/img/default-avatar.png" class="student-avatar">
                                    <h3 id="displayName" class="fw-bold mb-0">กำลังโหลด...</h3>
                                    <p id="displayStudentId" class="opacity-75 mb-0">Student ID</p>
                                </div>
                                <div class="card-body p-4">
                                    <div class="row g-3">
                                        <div class="col-6">
                                            <label class="small text-muted text-uppercase">ระดับชั้น</label>
                                            <p id="displayClass" class="fw-bold fs-5">-</p>
                                        </div>
                                        <div class="col-6">
                                            <label class="small text-muted text-uppercase">เลขที่</label>
                                            <p id="displayNo" class="fw-bold fs-5">-</p>
                                        </div>
                                        <hr>
                                        <div class="col-12">
                                            <a href="student_attendance_history.html" class="btn btn-light w-100 rounded-pill py-2 mb-2">
                                                <i class="bi bi-calendar-check me-2"></i> ดูประวัติการมาเรียน
                                            </a>
                                            <button onclick="logout()" class="btn btn-outline-danger w-100 rounded-pill py-2">
                                                <i class="bi bi-box-arrow-right me-2"></i> ออกจากระบบ
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div><script src="../public/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth('student');
            if (user) {
                // Fetch student data from api/me.php or similar
                const res = await fetch('../api/me.php');
                const data = await res.json();
                if (data.success) {
                    const s = data.user;
                    document.getElementById('displayName').innerText = `${s.prefix || ''}${s.first_name_th || ''} ${s.last_name_th || ''}`;
                    document.getElementById('displayStudentId').innerText = s.student_id || '';
                    document.getElementById('displayClass').innerText = (s.grade_level || '') + (s.grade_level && s.room ? ' ' : '') + (s.room ? `(${s.room})` : '-');
                    document.getElementById('displayNo').innerText = s.number_in_class || '-';
                    if (s.photo) document.getElementById('displayAvatar').src = '../' + s.photo;
                }
            }
        });
    </script>
</body>
</html>
