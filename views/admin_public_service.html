<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>กิจกรรมสาธารณประโยชน์ | CNP APP</title>
    <meta content='width=device-width, initial-scale=1.0, shrink-to-fit=no' name='viewport' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/notion.css">
    <style>
        :root {
            --premium-blue: #1e3c72;
            --premium-gradient: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        }
        body { font-family: 'Google Sans', 'Sarabun', sans-serif; background-color: #f8f9fa; }
        .card { border: none; border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .stat-card { transition: transform 0.3s ease; }
        .stat-card:hover { transform: translateY(-5px); }
        .icon-box { width: 60px; height: 60px; border-radius: 1rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .table thead th { background-color: #f8f9fa; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; color: #6c757d; border-bottom: 2px solid #dee2e6; }
        .btn-action { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 0.5rem; transition: 0.2s; }
        .badge-approved { background-color: #d1fae5; color: #065f46; border: 1px solid #10b981; }
        .badge-pending { background-color: #fef3c7; color: #92400e; border: 1px solid #f59e0b; }
    </style>
</head>
<body>
    <div class="wrapper">
        <aside class="sidebar" id="mainSidebar"></aside>
        <main class="main-panel">
            <div class="content px-4 py-5">
                <!-- Header Section -->
                <div class="d-flex justify-content-between align-items-end mb-5">
                    <div>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb mb-1">
                                <li class="breadcrumb-item small"><a href="admin_dashboard.html">หน้าหลัก</a></li>
                                <li class="breadcrumb-item small active">รายงานกิจกรรมสาธารณประโยชน์</li>
                            </ol>
                        </nav>
                        <h2 class="fw-bold text-dark mb-0">รายงานกิจกรรมสาธารณประโยชน์</h2>
                    </div>
                    <button class="btn btn-primary rounded-pill px-4 shadow-sm" onclick="showAddModal()">
                        <i class="bi bi-plus-lg me-2"></i> บันทึกกิจกรรมใหม่
                    </button>
                </div>

                <!-- Stats Row -->
                <div class="row g-4 mb-5">
                    <div class="col-md-4">
                        <div class="card stat-card h-100">
                            <div class="card-body d-flex align-items-center p-4">
                                <div class="icon-box bg-primary-subtle text-primary me-4">
                                    <i class="bi bi-clock-history"></i>
                                </div>
                                <div>
                                    <p class="text-muted small fw-bold mb-1">จำนวนครั้งที่เข้าร่วม (อนุมัติแล้ว)</p>
                                    <h2 class="fw-bold mb-0" id="stat-total-approved">0 <small class="fs-6 text-muted fw-normal">ครั้ง</small></h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card h-100">
                            <div class="card-body d-flex align-items-center p-4">
                                <div class="icon-box bg-success-subtle text-success me-4">
                                    <i class="bi bi-people"></i>
                                </div>
                                <div>
                                    <p class="text-muted small fw-bold mb-1">นักเรียนที่เข้าร่วม</p>
                                    <h2 class="fw-bold mb-0" id="stat-total-students">0 <small class="fs-6 text-muted fw-normal">คน</small></h2>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card stat-card h-100">
                            <div class="card-body d-flex align-items-center p-4">
                                <div class="icon-box bg-warning-subtle text-warning me-4">
                                    <i class="bi bi-hourglass-split"></i>
                                </div>
                                <div>
                                    <p class="text-muted small fw-bold mb-1">รอการตรวจสอบ</p>
                                    <h2 class="fw-bold mb-0" id="stat-total-pending">0 <small class="fs-6 text-muted fw-normal">รายการ</small></h2>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Filter Card -->
                <div class="card mb-4">
                    <div class="card-body p-4">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <label class="form-label small fw-bold text-muted">ปีการศึกษา</label>
                                <select class="form-select border-0 bg-light" id="filter-year">
                                    <option value="2569">2569</option>
                                    <option value="2568">2568</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label small fw-bold text-muted">ภาคเรียน</label>
                                <select class="form-select border-0 bg-light" id="filter-semester">
                                    <option value="1">ภาคเรียนที่ 1</option>
                                    <option value="2">ภาคเรียนที่ 2</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold text-muted">สถานะ</label>
                                <select class="form-select border-0 bg-light" id="filter-status">
                                    <option value="">-- ทั้งหมด --</option>
                                    <option value="pending">รอตรวจสอบ</option>
                                    <option value="approved">อนุมัติแล้ว</option>
                                    <option value="rejected">ไม่อนุมัติ</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold text-muted">ค้นหา</label>
                                <div class="input-group">
                                    <span class="input-group-text border-0 bg-light"><i class="bi bi-search"></i></span>
                                    <input type="text" class="form-control border-0 bg-light" id="filter-search" placeholder="ชื่อ, รหัส, หรือกิจกรรม...">
                                    <button class="btn btn-primary px-4" onclick="loadRecords()">กรองข้อมูล</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table Card -->
                <div class="card">
                    <div class="card-header bg-white border-bottom-0 pt-4 px-4 pb-0">
                        <h5 class="fw-bold mb-0"><i class="bi bi-list-ul me-2"></i> รายการกิจกรรมสาธารณประโยชน์</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-4">#</th>
                                        <th>นักเรียน</th>
                                        <th>กิจกรรม</th>
                                        <th>วันที่/สถานที่</th>
                                        <th>จำนวนครั้ง</th>
                                        <th>สถานะ</th>
                                        <th class="text-end pe-4">จัดการ</th>
                                    </tr>
                                </thead>
                                <tbody id="records-list">
                                    <!-- Dynamic content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../public/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAuth('admin');
            loadRecords();
        });

        async function loadRecords() {
            const list = document.getElementById('records-list');
            list.innerHTML = '<tr><td colspan="7" class="text-center py-5"><div class="spinner-border text-primary"></div></td></tr>';

            try {
                const year = document.getElementById('filter-year').value;
                const semester = document.getElementById('filter-semester').value;
                const status = document.getElementById('filter-status').value;
                const search = document.getElementById('filter-search').value;

                const res = await fetch(`../api/public_service.php?year=${year}&semester=${semester}&status=${status}&search=${search}`);
                const data = await res.json();

                if (data.success) {
                    // Update Stats
                    document.getElementById('stat-total-approved').innerHTML = `${data.stats.approved_count} <small class="fs-6 text-muted fw-normal">ครั้ง</small>`;
                    document.getElementById('stat-total-students').innerHTML = `${data.stats.total_students} <small class="fs-6 text-muted fw-normal">คน</small>`;
                    document.getElementById('stat-total-pending').innerHTML = `${data.stats.pending_count} <small class="fs-6 text-muted fw-normal">รายการ</small>`;

                    // Render Table
                    let html = '';
                    data.records.forEach((r, idx) => {
                        const statusBadge = r.status === 'approved' 
                            ? '<span class="badge badge-approved rounded-pill px-3 py-2"><i class="bi bi-check-circle-fill me-1"></i> อนุมัติ</span>'
                            : r.status === 'rejected'
                            ? '<span class="badge bg-danger-subtle text-danger border border-danger rounded-pill px-3 py-2">ไม่อนุมัติ</span>'
                            : '<span class="badge badge-pending rounded-pill px-3 py-2">รอตรวจสอบ</span>';

                        html += `
                            <tr>
                                <td class="ps-4 text-muted small">${idx + 1}</td>
                                <td>
                                    <div class="fw-bold text-dark">${r.first_name_th} ${r.last_name_th}</div>
                                    <div class="small text-muted"><i class="bi bi-person-badge me-1"></i>${r.student_id} | <i class="bi bi-door-open me-1"></i>ห้อง ${r.room}</div>
                                </td>
                                <td>
                                    <div class="fw-bold text-primary">${r.activity_name}</div>
                                    <div class="small text-muted"><i class="bi bi-person-check me-1"></i>รับรอง: ${r.certifier_name || '-'}</div>
                                    ${r.status === 'approved' ? `<div class="small text-success"><i class="bi bi-shield-check me-1"></i>อนุมัติโดย: ${r.approver_name || '-'}</div>` : ''}
                                </td>
                                <td>
                                    <div class="small fw-bold text-dark"><i class="bi bi-calendar-event me-2"></i>${r.activity_date_th}</div>
                                    <div class="small text-muted"><i class="bi bi-geo-alt me-2"></i>${r.location}</div>
                                </td>
                                <td class="fw-bold text-dark">${r.duration} ${r.duration_unit}</td>
                                <td>${statusBadge}</td>
                                <td class="text-end pe-4">
                                    <div class="d-flex gap-1 justify-content-end">
                                        ${r.status === 'pending' ? `
                                            <button class="btn btn-action btn-outline-success border-0" title="อนุมัติ" onclick="updateStatus(${r.id}, 'approved')">
                                                <i class="bi bi-check-circle"></i>
                                            </button>
                                        ` : ''}
                                        <button class="btn btn-action btn-outline-info border-0" title="ดูรายละเอียด">
                                            <i class="bi bi-eye"></i>
                                        </button>
                                        <button class="btn btn-action btn-outline-danger border-0" title="ลบ" onclick="deleteRecord(${r.id})">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                    list.innerHTML = html || '<tr><td colspan="7" class="text-center py-5 text-muted">ไม่พบข้อมูล</td></tr>';
                }
            } catch (e) {
                console.error(e);
                list.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-danger">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
            }
        }

        async function updateStatus(id, status) {
            const result = await Swal.fire({
                title: status === 'approved' ? 'ยืนยันการอนุมัติ?' : 'ยืนยันการปฏิเสธ?',
                text: "คุณต้องการเปลี่ยนสถานะรายการนี้ใช่หรือไม่",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'ตกลง',
                cancelButtonText: 'ยกเลิก'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch('../api/public_service.php', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id, status })
                    });
                    const data = await res.json();
                    if (data.success) {
                        Swal.fire('สำเร็จ!', 'อัปเดตสถานะเรียบร้อยแล้ว', 'success');
                        loadRecords();
                    }
                } catch (e) {
                    Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                }
            }
        }

        async function deleteRecord(id) {
            const result = await Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "ข้อมูลจะถูกลบถาวร ไม่สามารถกู้คืนได้",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'ลบข้อมูล',
                cancelButtonText: 'ยกเลิก'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`../api/public_service.php?id=${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        Swal.fire('ลบแล้ว!', 'ลบข้อมูลเรียบร้อยแล้ว', 'success');
                        loadRecords();
                    }
                } catch (e) {
                    Swal.fire('ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
                }
            }
        }
    </script>
</body>
</html>
